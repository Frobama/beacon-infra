name: beacon

services:
  # ---------- Infraestructura ----------
  nats:
    image: nats:2.10-alpine
    command: ["-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  alerts-db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${ALERTS_DB_USER:-beacon}
      POSTGRES_PASSWORD: ${ALERTS_DB_PASSWORD:-beacon}
      POSTGRES_DB: ${ALERTS_DB_NAME:-alerts}
    ports:
      - "${ALERTS_DB_PORT:-5433}:5432"
    volumes:
      - alerts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALERTS_DB_USER:-beacon} -d ${ALERTS_DB_NAME:-alerts}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  incidents-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${INCIDENTS_DB_USER:-beacon}
      POSTGRES_PASSWORD: ${INCIDENTS_DB_PASSWORD:-beacon}
      POSTGRES_DB: ${INCIDENTS_DB_NAME:-incidents}
    ports:
      - "${INCIDENTS_DB_PORT:-5434}:5432"
    volumes:
      - incidents-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INCIDENTS_DB_USER:-beacon} -d ${INCIDENTS_DB_NAME:-incidents}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  notifications-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOTIFICATIONS_DB_USER:-beacon}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-beacon}
    ports:
      - "${NOTIFICATIONS_DB_PORT:-27017}:27017"
    volumes:
      - notifications-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- Aplicaciones (perfil "apps") ----------
  incidents:
    profiles: ["apps"]
    build:
      context: ../beacon-incidents
    environment:
      DB_URL: jdbc:postgresql://incidents-db:5432/${INCIDENTS_DB_NAME:-incidents}
      DB_USER: ${INCIDENTS_DB_USER:-beacon}
      DB_PASSWORD: ${INCIDENTS_DB_PASSWORD:-beacon}
      GRPC_PORT: "9090"
    ports:
      - "${INCIDENTS_GRPC_PORT:-9090}:9090"
      - "${INCIDENTS_HTTP_PORT:-8081}:8080"
    depends_on:
      incidents-db:
        condition: service_healthy
    restart: unless-stopped

  backend:
    profiles: ["apps"]
    build:
      context: ../beacon-backend
    environment:
      PORT: "3000"
      INCIDENTS_GRPC_URL: incidents:9090
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    depends_on:
      - incidents
    restart: unless-stopped

  frontend:
    profiles: ["apps"]
    build:
      context: ../beacon-frontend
      args:
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:${BACKEND_PORT:-3001}/graphql
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  alerts-db-data:
  incidents-db-data:
  notifications-db-data:
